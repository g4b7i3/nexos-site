# Site da Nexos + app (pasta /app). Publicado direto do GitHub, sem build.
[build]
  publish = "."
  command = ""

# O service worker e a página do app nunca ficam presos em cache velho
[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Link curto para a bio do Instagram: abre a ficha de entrada geral (cria o acesso ao app no final)
[[redirects]]
  from = "/aluno"
  to = "/app/#/ficha/07a9a8d4aeba1eb6c6"
  status = 302
  force = true
