<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="590" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Engasgo grave no adulto</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Não tosse, não fala, leva a mão ao pescoço</text><rect x="40" y="125" width="340" height="330" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="150" cy="215" r="24" fill="#0b1630"/><polyline points="165,240 250,300" fill="none" stroke="#0b1630" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><polyline points="250,300 250,410" fill="none" stroke="#1b2c55" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><polyline points="175,255 150,330" fill="none" stroke="#1b2c55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="190" r="22" fill="#0e8fc0"/><polyline points="300,215 300,330 300,410" fill="none" stroke="#0e8fc0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><polyline points="300,240 235,262" fill="none" stroke="#0e8fc0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M212 250 l12 -10 M218 262 l14 -4" stroke="#d93b3f" stroke-width="4" stroke-linecap="round"/><text x="210" y="490" font-size="22" font-weight="800" fill="#0b1630" text-anchor="middle">5 tapas nas costas</text><text x="210" y="516" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="middle">entre as escápulas, com a base da mão</text><rect x="420" y="125" width="340" height="330" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="560" cy="195" r="24" fill="#0b1630"/><polyline points="560,222 560,330 560,410" fill="none" stroke="#0b1630" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="190" r="22" fill="#0e8fc0"/><polyline points="620,215 625,330 625,410" fill="none" stroke="#0e8fc0" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><polyline points="612,250 575,285" fill="none" stroke="#0e8fc0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="565" cy="290" r="13" fill="#0e8fc0" stroke="#fff" stroke-width="3"/><path d="M548 300 q-10 -14 2 -26" fill="none" stroke="#d93b3f" stroke-width="4" stroke-linecap="round"/><text x="590" y="490" font-size="22" font-weight="800" fill="#0b1630" text-anchor="middle">5 compressões abdominais</text><text x="590" y="516" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="middle">punho acima do umbigo, para dentro e para cima</text><path d="M382 260 C395 240 405 240 418 260" fill="none" stroke="#5b6b85" stroke-width="4"/><path d="M418 290 C405 310 395 310 382 290" fill="none" stroke="#5b6b85" stroke-width="4"/><text x="400" y="566" font-size="17" font-weight="700" fill="#d93b3f" text-anchor="middle">Alterne até sair o objeto. Se desmaiar, ligue 192 e comece a RCP.</text></svg>