<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="580" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Avaliação inicial</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Os primeiros segundos decidem o atendimento</text><rect x="40" y="130" width="220" height="150" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="70" cy="165" r="17" fill="#0e8fc0"/><text x="70" y="172" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="96" y="172" font-size="19" font-weight="800" fill="#0b1630" text-anchor="start">O local é seguro?</text><text x="62" y="214.0" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">Trânsito, queda, choque.</text><text x="62" y="236.1" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">Afaste o perigo antes.</text><line x1="264" y1="205" x2="281" y2="205" stroke="#5b6b85" stroke-width="4" stroke-linecap="round"/><path d="M281,205 L268.4,211.1 L268.4,198.9 Z" fill="#5b6b85"/><rect x="285" y="130" width="220" height="150" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="315" cy="165" r="17" fill="#0e8fc0"/><text x="315" y="172" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="341" y="172" font-size="19" font-weight="800" fill="#0b1630" text-anchor="start">A pessoa responde?</text><text x="307" y="214.0" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">Toque nos ombros</text><text x="307" y="236.1" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">e chame em voz alta.</text><line x1="509" y1="205" x2="526" y2="205" stroke="#5b6b85" stroke-width="4" stroke-linecap="round"/><path d="M526,205 L513.4,211.1 L513.4,198.9 Z" fill="#5b6b85"/><rect x="530" y="130" width="220" height="150" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="560" cy="165" r="17" fill="#0e8fc0"/><text x="560" y="172" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="586" y="172" font-size="19" font-weight="800" fill="#0b1630" text-anchor="start">Respira normal?</text><text x="552" y="214.0" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">Olhe o peito subir</text><text x="552" y="236.1" font-size="17" font-weight="500" fill="#5b6b85" text-anchor="start">por até 10 segundos.</text><polyline points="722,282 722,305 212,305" fill="none" stroke="#5b6b85" stroke-width="4" stroke-linejoin="round"/><line x1="212" y1="303" x2="212" y2="326" stroke="#5b6b85" stroke-width="4" stroke-linecap="round"/><path d="M212,326 L205.9,313.4 L218.1,313.4 Z" fill="#5b6b85"/><line x1="582" y1="303" x2="582" y2="326" stroke="#5b6b85" stroke-width="4" stroke-linecap="round"/><path d="M582,326 L575.9,313.4 L588.1,313.4 Z" fill="#5b6b85"/><rect x="40" y="330" width="345" height="190" rx="18" fill="#e3f6ee" stroke="none" stroke-width="2"/><text x="64" y="370" font-size="21" font-weight="800" fill="#1f9d6b" text-anchor="start">Respira normal</text><text x="64" y="408.0" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">Posição de recuperação.</text><text x="64" y="431.4" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">Ligue 192 e fique ao lado,</text><text x="64" y="454.8" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">olhando a respiração.</text><rect x="405" y="330" width="355" height="190" rx="18" fill="#fde8e8" stroke="none" stroke-width="2"/><text x="429" y="370" font-size="20" font-weight="800" fill="#d93b3f" text-anchor="start">Não respira ou só “puxa” o ar</text><text x="429" y="408.0" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">Ligue 192 no viva-voz.</text><text x="429" y="431.4" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">Mande alguém buscar o DEA.</text><text x="429" y="454.8" font-size="18" font-weight="500" fill="#0b1630" text-anchor="start">Comece as compressões já.</text><text x="400" y="556" font-size="16" font-weight="600" fill="#5b6b85" text-anchor="middle">Respiração agônica (suspiros lentos e irregulares) é sinal de parada. Não espere.</text></svg>