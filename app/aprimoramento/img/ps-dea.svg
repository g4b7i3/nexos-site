<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="570" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Desfibrilador (DEA)</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Ligue e siga a voz do aparelho</text><path d="M80 160 Q80 140 110 132 L180 118 Q220 150 260 118 L330 132 Q360 140 360 160 L350 470 L90 470 Z" fill="#eef2f8" stroke="#0b1630" stroke-width="3"/><rect x="108" y="160" width="74" height="96" rx="12" fill="#0e8fc0" transform="rotate(-8 145 208)"/><text x="145" y="214" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="270" y="300" width="74" height="96" rx="12" fill="#0e8fc0" transform="rotate(18 307 348)"/><text x="307" y="356" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="80" y="510.0" font-size="16" font-weight="600" fill="#5b6b85" text-anchor="start">Pá 1 abaixo da clavícula direita.</text><text x="80" y="530.8" font-size="16" font-weight="600" fill="#5b6b85" text-anchor="start">Pá 2 do lado esquerdo, abaixo da axila.</text><rect x="410" y="140" width="350" height="84" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="440" cy="182" r="17" fill="#0e8fc0"/><text x="440" y="189" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="472" y="176.0" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">Ligue o DEA</text><text x="472" y="199.4" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">e siga a voz.</text><rect x="410" y="240" width="350" height="84" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="440" cy="282" r="17" fill="#0e8fc0"/><text x="440" y="289" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="472" y="276.0" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">Peito sem roupa e seco.</text><text x="472" y="299.4" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">Cole as pás como no desenho.</text><rect x="410" y="340" width="350" height="84" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="440" cy="382" r="17" fill="#0e8fc0"/><text x="440" y="389" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="472" y="376.0" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">Ninguém encosta</text><text x="472" y="399.4" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">na análise e no choque.</text><rect x="410" y="440" width="350" height="84" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><circle cx="440" cy="482" r="17" fill="#0e8fc0"/><text x="440" y="489" font-size="19" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="472" y="476.0" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">Logo após o choque,</text><text x="472" y="499.4" font-size="18" font-weight="600" fill="#0b1630" text-anchor="start">volte às compressões.</text></svg>