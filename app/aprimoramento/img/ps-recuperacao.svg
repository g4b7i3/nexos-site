<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="570" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Posição de recuperação</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Para quem respira normal mas não responde</text><rect x="60" y="400" width="680" height="10" rx="5" fill="#eef2f8"/><circle cx="150" cy="330" r="30" fill="#0b1630"/><polyline points="185,345 420,350" fill="none" stroke="#0b1630" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><polyline points="420,352 600,372 690,388" fill="none" stroke="#1b2c55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><polyline points="420,345 520,300 560,380" fill="none" stroke="#0b1630" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><polyline points="230,335 200,300 165,318" fill="none" stroke="#0b1630" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><polyline points="240,360 330,388" fill="none" stroke="#1b2c55" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><circle cx="165" cy="320" r="11" fill="#0e8fc0"/><path d="M120 345 q-6 10 4 16" fill="none" stroke="#0e8fc0" stroke-width="5" stroke-linecap="round"/><line x1="165" y1="320" x2="95" y2="175" stroke="#0e8fc0" stroke-width="2.5"/><circle cx="165" cy="320" r="6" fill="#0e8fc0"/><text x="103" y="181.0" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Mão sob o rosto</text><line x1="118" y1="352" x2="60" y2="470" stroke="#0e8fc0" stroke-width="2.5"/><circle cx="118" cy="352" r="6" fill="#0e8fc0"/><text x="68" y="476.0" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Cabeça para trás e boca</text><text x="68" y="498.1" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">para baixo, para escorrer</text><line x1="520" y1="300" x2="560" y2="190" stroke="#0e8fc0" stroke-width="2.5"/><circle cx="520" cy="300" r="6" fill="#0e8fc0"/><text x="568" y="196.0" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">Joelho de cima dobrado</text><text x="568" y="218.1" font-size="17" font-weight="600" fill="#0b1630" text-anchor="start">apoia e não deixa virar</text><line x1="640" y1="382" x2="650" y2="470" stroke="#0e8fc0" stroke-width="2.5"/><circle cx="640" cy="382" r="6" fill="#0e8fc0"/><text x="642" y="476.0" font-size="17" font-weight="600" fill="#0b1630" text-anchor="end">Perna de baixo esticada</text><text x="400" y="540" font-size="16" font-weight="600" fill="#5b6b85" text-anchor="middle">Confira a respiração a cada minuto. Se parar, volte para barriga para cima e comece a RCP.</text></svg>