<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="570" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Entorse e lesão de tecido mole</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">PEACE &amp; LOVE (Dubois e Esculier, 2020)</text><text x="40" y="140" font-size="18" font-weight="800" fill="#0e8fc0" text-anchor="start">Primeiros dias</text><rect x="40" y="158" width="350" height="66" rx="14" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="72" y="202" font-size="30" font-weight="800" fill="#0e8fc0" text-anchor="middle">P</text><text x="104" y="188" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Proteger</text><text x="104" y="211" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">alguns dias, evite o que dói</text><rect x="40" y="234" width="350" height="66" rx="14" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="72" y="278" font-size="30" font-weight="800" fill="#0e8fc0" text-anchor="middle">E</text><text x="104" y="264" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Elevar</text><text x="104" y="287" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">acima do coração</text><rect x="40" y="310" width="350" height="66" rx="14" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="72" y="354" font-size="30" font-weight="800" fill="#0e8fc0" text-anchor="middle">A</text><text x="104" y="340" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Evitar anti-inflamatório</text><text x="104" y="363" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">nos primeiros dias</text><rect x="40" y="386" width="350" height="66" rx="14" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="72" y="430" font-size="30" font-weight="800" fill="#0e8fc0" text-anchor="middle">C</text><text x="104" y="416" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Comprimir</text><text x="104" y="439" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">faixa ou bandagem</text><rect x="40" y="462" width="350" height="66" rx="14" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="72" y="506" font-size="30" font-weight="800" fill="#0e8fc0" text-anchor="middle">E</text><text x="104" y="492" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Educar</text><text x="104" y="515" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">o corpo sabe se recuperar</text><text x="410" y="140" font-size="18" font-weight="800" fill="#1f9d6b" text-anchor="start">Depois</text><rect x="410" y="158" width="350" height="66" rx="14" fill="#e3f6ee" stroke="none" stroke-width="2"/><text x="442" y="202" font-size="30" font-weight="800" fill="#1f9d6b" text-anchor="middle">L</text><text x="474" y="188" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Carga</text><text x="474" y="211" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">volte a usar aos poucos</text><rect x="410" y="234" width="350" height="66" rx="14" fill="#e3f6ee" stroke="none" stroke-width="2"/><text x="442" y="278" font-size="30" font-weight="800" fill="#1f9d6b" text-anchor="middle">O</text><text x="474" y="264" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Otimismo</text><text x="474" y="287" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">confiança ajuda a recuperar</text><rect x="410" y="310" width="350" height="66" rx="14" fill="#e3f6ee" stroke="none" stroke-width="2"/><text x="442" y="354" font-size="30" font-weight="800" fill="#1f9d6b" text-anchor="middle">V</text><text x="474" y="340" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Vascularização</text><text x="474" y="363" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">exercício sem dor</text><rect x="410" y="386" width="350" height="66" rx="14" fill="#e3f6ee" stroke="none" stroke-width="2"/><text x="442" y="430" font-size="30" font-weight="800" fill="#1f9d6b" text-anchor="middle">E</text><text x="474" y="416" font-size="18" font-weight="800" fill="#0b1630" text-anchor="start">Exercício</text><text x="474" y="439" font-size="15" font-weight="500" fill="#5b6b85" text-anchor="start">força, mobilidade, equilíbrio</text><rect x="410" y="470" width="350" height="66" rx="14" fill="#fde8e8" stroke="none" stroke-width="2"/><text x="430" y="498.0" font-size="15" font-weight="700" fill="#d93b3f" text-anchor="start">Não apoia o pé, dor no osso ou</text><text x="430" y="517.5" font-size="15" font-weight="700" fill="#d93b3f" text-anchor="start">deformidade: avaliação médica.</text></svg>