<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="590" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Calor no treino</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Saber a diferença salva vidas</text><rect x="40" y="120" width="350" height="270" rx="18" fill="#dff4fc" stroke="none" stroke-width="2"/><text x="64" y="160" font-size="22" font-weight="800" fill="#0e8fc0" text-anchor="start">Exaustão pelo calor</text><text x="64" y="198.0" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">Cansaço forte, tontura, enjoo.</text><text x="64" y="220.1" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">Pele molhada, pode estar pálida.</text><text x="64" y="242.2" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">Está lúcido, conversa bem.</text><text x="64" y="302" font-size="16" font-weight="800" fill="#0b1630" text-anchor="start">O que fazer</text><text x="64" y="330.0" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">Sombra, deitado, pernas para cima.</text><text x="64" y="350.8" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">Água ou isotônico se aceitar.</text><rect x="410" y="120" width="350" height="270" rx="18" fill="#fde8e8" stroke="none" stroke-width="2"/><text x="434" y="160" font-size="22" font-weight="800" fill="#d93b3f" text-anchor="start">Intermação (golpe de calor)</text><text x="434" y="198.0" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">Confusão, fala enrolada, agressivo,</text><text x="434" y="220.1" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">cambaleia, desmaia ou convulsiona.</text><text x="434" y="242.2" font-size="17" font-weight="500" fill="#0b1630" text-anchor="start">Pele quente; pode suar ainda.</text><text x="434" y="302" font-size="16" font-weight="800" fill="#d93b3f" text-anchor="start">Emergência</text><text x="434" y="330.0" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">Ligue 192 e resfrie já.</text><text x="434" y="350.8" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">Não espere a ambulância.</text><rect x="40" y="410" width="720" height="150" rx="18" fill="#0b1630" stroke="none" stroke-width="2"/><text x="64" y="450" font-size="22" font-weight="800" fill="#fff" text-anchor="start">Resfrie primeiro, transporte depois</text><text x="64" y="494" font-size="16" font-weight="800" fill="#7fdcff" text-anchor="start">Melhor</text><text x="64" y="522" font-size="16" font-weight="500" fill="#fff" text-anchor="start">corpo na água com gelo</text><text x="296" y="494" font-size="16" font-weight="800" fill="#7fdcff" text-anchor="start">Sem banheira</text><text x="296" y="522" font-size="16" font-weight="500" fill="#fff" text-anchor="start">lona com água e gelo</text><text x="528" y="494" font-size="16" font-weight="800" fill="#7fdcff" text-anchor="start">Mínimo</text><text x="528" y="522" font-size="16" font-weight="500" fill="#fff" text-anchor="start">toalhas geladas trocadas</text></svg>