<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" font-family="Manrope, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="800" height="570" rx="28" fill="#fff"/><text x="40" y="62" font-size="30" font-weight="800" fill="#0b1630" text-anchor="start">Mal-estar depois de parar</text><text x="40" y="94" font-size="19" font-weight="500" fill="#5b6b85" text-anchor="start">Comum logo após a chegada ou um tiro forte</text><rect x="60" y="390" width="680" height="10" rx="5" fill="#eef2f8"/><rect x="470" y="300" width="160" height="90" rx="14" fill="#dff4fc" stroke="#0e8fc0" stroke-width="2"/><circle cx="140" cy="360" r="28" fill="#0b1630"/><polyline points="175,370 400,370" fill="none" stroke="#0b1630" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><polyline points="400,368 500,300 640,285" fill="none" stroke="#1b2c55" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><polyline points="230,372 330,386" fill="none" stroke="#1b2c55" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="232.0" font-size="17" font-weight="700" fill="#0e8fc0" text-anchor="middle">Pernas mais altas</text><text x="560" y="254.1" font-size="17" font-weight="700" fill="#0e8fc0" text-anchor="middle">que o coração</text><rect x="60" y="430" width="330" height="110" rx="18" fill="#eef2f8" stroke="none" stroke-width="2"/><text x="84" y="470" font-size="19" font-weight="800" fill="#0b1630" text-anchor="start">Pressão cai ao parar</text><text x="84" y="500.0" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">O sangue fica nas pernas.</text><text x="84" y="520.8" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">Deitado, melhora em minutos.</text><rect x="410" y="430" width="330" height="110" rx="18" fill="#fde8e8" stroke="none" stroke-width="2"/><text x="434" y="470" font-size="19" font-weight="800" fill="#d93b3f" text-anchor="start">Ligue 192 se</text><text x="434" y="500.0" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">não melhorar em poucos minutos,</text><text x="434" y="520.8" font-size="16" font-weight="500" fill="#5b6b85" text-anchor="start">estiver confuso ou com dor no peito.</text></svg>