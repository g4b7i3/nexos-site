<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexos · Empreender</title>
<meta name="theme-color" content="#f3f6fb">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#f3f6fb;--card:#fff;--s1:#eef2f9;--s2:#e4ebf6;--line:#dfe6f2;--ink:#0b1834;--mute:#55657f;--dim:#8492aa;--acc:#0284c7;--acc2:#2f6bff;--ok:#0e9a5f;--err:#d23f3f;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1,h2,.num{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em}
h1{font-size:1.7rem;margin:4px 0 0}
h2{font-size:1.05rem;margin:0}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0}
.muted{color:var(--mute)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{height:26px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{appearance:none;border:0;border-radius:14px;background:var(--acc);color:#fff;font:700 .95rem Manrope,sans-serif;padding:13px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--acc);font:700 .86rem Manrope,sans-serif;cursor:pointer;padding:0}
.link.err{color:var(--err)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:.8rem;font-weight:700;color:var(--mute);margin-bottom:6px}
.in{width:100%;border:1px solid var(--line);background:var(--s1);border-radius:12px;padding:12px 13px;font:500 1rem Manrope,sans-serif;color:var(--ink)}
.in:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat .num{font-size:1.25rem;margin-top:4px}
.stat.hl{background:linear-gradient(135deg,#0b2a5c,#0284c7);color:#fff;border:0;grid-column:1/-1}
.stat.hl .muted,.stat.hl .dim{color:rgba(255,255,255,.78)}
.stat.hl .num{font-size:1.7rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font:700 .86rem Manrope,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prev{margin-top:4px;padding:12px 14px;border-radius:12px;background:#e8f4fb;color:#0b4a6e;font-size:.9rem;line-height:1.45}
section{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.g{display:flex;flex-direction:column;gap:8px}
.g-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.g-top b{font-size:1rem}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--mute);margin-left:6px;vertical-align:2px}
.tag.ok{background:#e3f6ee;color:var(--ok)}
.bar{height:6px;border-radius:9px;background:var(--s2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.acts{display:flex;gap:14px;margin-top:2px}
.pg{display:flex;flex-direction:column;gap:4px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--s1)}
.pg-l{display:flex;justify-content:space-between;gap:10px;font-size:.86rem}
.pg-l b{font-weight:800}
.pg-l .ok{color:var(--ok);font-weight:800}.pg-l .falta{color:var(--err);font-weight:800}
.pg-h{font-size:.76rem;color:var(--dim)}
.pg-h button{margin-left:6px;font-size:.76rem}
.quem{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.quem .chip{padding:14px;font-size:1rem;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.atual td{font-weight:800;color:var(--acc)}
.vazio{text-align:center;padding:26px 16px;color:var(--mute)}
.gate{max-width:380px;margin:12vh auto 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--err)}
dialog{border:0;border-radius:22px;padding:20px;width:min(520px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(11,24,52,.25)}
dialog::backdrop{background:rgba(11,24,52,.45)}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app/supabase.js"></script>
<script>
'use strict';
/* Empreender: gastos da sociedade Nexos. Entra só com a senha da página; a senha é conferida no servidor
   (funções nx_emp_* no Supabase), e cada gasto parcelado vira as parcelas por mês, divididas entre os dois sócios. */
const sb = window.supabase.createClient('https://gbcshtmesawpokuwiaxb.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiY3NodG1lc2F3cG9rdXdpYXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MDg2MjYsImV4cCI6MjEwODk4NDYyNn0.ZR4vHBDAa_yMA8pSCWUriKAoh8OsEUKXO7WgZnR89Ak', { auth: { persistSession: false } });
const SOCIOS = 2;
const CATS = ['Equipamentos', 'Uniformes', 'Marketing', 'Site e aplicativos', 'Eventos', 'Taxas e documentos', 'Espaço', 'Outros'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const $app = document.getElementById('app'), $dlg = document.getElementById('dlg');
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const brl = (v) => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const hojeMes = () => { const d = new Date(); return d.getFullYear() * 12 + d.getMonth(); };
const mesIdx = (iso) => { const [y, m] = String(iso).split('-').map(Number); return y * 12 + (m - 1); };
const mesNome = (i) => `${MESES[i % 12]}/${Math.floor(i / 12)}`;
const mesISO = (i) => `${Math.floor(i / 12)}-${String((i % 12) + 1).padStart(2, '0')}`;
let senha = null, itens = [], pagos = [];
const NOMES = ['Gabriel', 'Orlando'];
const cent = (v) => Math.round(v * 100) / 100;
/* quanto cada sócio deve de um gasto: a metade das parcelas que já venceram (até este mês) e a metade do total */
function contaSocio(g, socio, hoje) {
  const ps = parcelas(g);
  const devidoAgora = cent(ps.filter((p) => p.mes <= hoje).reduce((a, p) => a + p.v, 0) / SOCIOS);
  const devidoTotal = cent(+g.valor / SOCIOS);
  const pago = cent(pagos.filter((x) => x.gasto_id === g.id && x.socio === socio).reduce((a, x) => a + +x.valor, 0));
  return { devidoAgora, devidoTotal, pago, faltaAgora: Math.max(0, cent(devidoAgora - pago)), faltaTotal: Math.max(0, cent(devidoTotal - pago)), aMais: Math.max(0, cent(pago - devidoTotal)) };
}
const dataBR = (iso) => { const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}`; };
const guarda = {
  ler() { try { return sessionStorage.getItem('nx-emp') || localStorage.getItem('nx-emp'); } catch { return null; } },
  gravar(s, lembrar) { try { sessionStorage.setItem('nx-emp', s); if (lembrar) localStorage.setItem('nx-emp', s); } catch {} },
  limpar() { try { sessionStorage.removeItem('nx-emp'); localStorage.removeItem('nx-emp'); } catch {} },
};
function toast(t, erro) {
  const el = document.getElementById('toast');
  el.textContent = t; el.className = 'toast on' + (erro ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.className = 'toast'), 3200);
}
const msgErro = (e) => (e === 'travado' ? 'Muitas tentativas. Espere 15 minutos.' : e === 'senha' ? 'Senha incorreta.' : 'Não foi possível agora. Tente de novo.');

/* parcelas: valor dividido em n vezes; a última parcela acerta os centavos */
function parcelas(g) {
  const n = g.parcelas || 1, base = Math.floor((+g.valor / n) * 100) / 100, ini = mesIdx(g.inicio);
  return Array.from({ length: n }, (_, k) => ({ mes: ini + k, v: k === n - 1 ? Math.round((+g.valor - base * (n - 1)) * 100) / 100 : base }));
}
const fimDe = (g) => mesIdx(g.inicio) + (g.parcelas || 1) - 1;

/* ---------- acesso ---------- */
async function iniciar() {
  const s = guarda.ler();
  if (s && (await carregar(s))) return painel();
  const { data: tem } = await sb.rpc('nx_emp_tem_senha');
  telaSenha(!tem);
}
function telaSenha(criar) {
  $app.innerHTML = `<div class="gate"><img class="logo" src="/app/icons/wordmark-escuro.svg" alt="Nexos"><p class="eyebrow">Nexos · sociedade</p><h1>Empreender</h1>
    <p class="muted" style="margin:8px 0 18px">${criar ? 'Primeiro acesso: crie a senha desta página. Ela vale para os dois sócios.' : 'Os gastos da sociedade. Digite a senha para entrar.'}</p>
    <form id="f" class="card">
      <label class="f"><span>${criar ? 'Senha nova' : 'Senha'}</span><input class="in" type="password" name="s" required minlength="6" autocomplete="${criar ? 'new-password' : 'current-password'}"></label>
      ${criar ? '<label class="f"><span>Repita a senha</span><input class="in" type="password" name="s2" required minlength="6" autocomplete="new-password"></label>' : ''}
      <label class="small muted" style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" name="lembrar" checked> Lembrar neste aparelho</label>
      <button class="btn block">${criar ? 'Criar senha e entrar' : 'Entrar'}</button></form></div>`;
  const f = document.getElementById('f');
  f.s.focus();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const s = f.s.value, b = f.querySelector('button');
    if (criar && s !== f.s2.value) return toast('As duas senhas estão diferentes.', true);
    b.disabled = true;
    if (criar) {
      const { data, error } = await sb.rpc('nx_emp_criar_senha', { p_nova: s });
      if (error || !data) { b.disabled = false; return toast(error ? 'Use pelo menos 6 caracteres.' : 'A senha já foi criada. Entre com ela.', true); }
    }
    if (await carregar(s)) { guarda.gravar(s, f.lembrar.checked); return painel(); }
    b.disabled = false;
  };
}
async function carregar(s) {
  const { data, error } = await sb.rpc('nx_emp_listar', { p_senha: s });
  if (error || !data || data.erro) { if (data && data.erro) toast(msgErro(data.erro), true); guarda.limpar(); return false; }
  senha = s; itens = data.itens || []; pagos = data.pagos || []; return true;
}

/* ---------- painel ---------- */
function painel() {
  const hoje = hojeMes();
  const porMes = {};
  itens.forEach((g) => parcelas(g).forEach((p) => (porMes[p.mes] = (porMes[p.mes] || 0) + p.v)));
  const meses = Object.keys(porMes).map(Number).sort((a, b) => a - b);
  const ult = meses.length ? meses[meses.length - 1] : null;
  const total = itens.reduce((a, g) => a + +g.valor, 0);
  const falta = meses.filter((m) => m > hoje).reduce((a, m) => a + porMes[m], 0);
  const esteMes = porMes[hoje] || 0, proximo = porMes[hoje + 1] || 0;
  const futuros = meses.filter((m) => m >= hoje), antigos = meses.filter((m) => m < hoje);
  const linhaMes = (m) => `<tr class="${m === hoje ? 'atual' : ''}"><td>${mesNome(m)}${m === hoje ? ' · este mês' : ''}</td><td class="r">${brl(porMes[m])}</td><td class="r">${brl(porMes[m] / SOCIOS)}</td></tr>`;
  $app.innerHTML = `<div class="top"><div><img class="logo" src="/app/icons/wordmark-escuro.svg" alt="Nexos"><p class="eyebrow">Nexos · sociedade</p><h1>Empreender</h1></div>
      <button class="link" id="sair" style="margin-top:6px">Sair</button></div>
    <div class="stats">
      <div class="card stat hl"><span class="small muted">Este mês (${mesNome(hoje)}) · cada sócio paga</span><div class="num">${brl(esteMes / SOCIOS)}</div><span class="tiny dim">${brl(esteMes)} no total, dividido entre os ${SOCIOS}</span></div>
      <div class="card stat"><span class="small muted">Próximo mês</span><div class="num">${brl(proximo / SOCIOS)}</div><span class="tiny dim">por sócio · ${brl(proximo)} no total</span></div>
      <div class="card stat"><span class="small muted">Falta pagar</span><div class="num">${brl(falta / SOCIOS)}</div><span class="tiny dim">por sócio${ult != null && ult > hoje ? ` · até ${mesNome(ult)}` : ''}</span></div>
      <div class="card stat"><span class="small muted">Total investido</span><div class="num">${brl(total)}</div><span class="tiny dim">${brl(total / SOCIOS)} de cada sócio</span></div>
      <div class="card stat"><span class="small muted">Tudo quitado em</span><div class="num">${ult == null ? '—' : ult <= hoje ? 'em dia' : mesNome(ult)}</div><span class="tiny dim">${itens.length} gasto${itens.length === 1 ? '' : 's'} registrado${itens.length === 1 ? '' : 's'}</span></div>
    </div>
    ${itens.length ? `<section><div class="sec-h"><h2>Quanto cada um já pagou</h2></div><div class="stats">${NOMES.map((n) => {
      const c = itens.map((g) => contaSocio(g, n, hoje)).reduce((a, x) => ({ pago: a.pago + x.pago, faltaAgora: a.faltaAgora + x.faltaAgora, faltaTotal: a.faltaTotal + x.faltaTotal }), { pago: 0, faltaAgora: 0, faltaTotal: 0 });
      return `<div class="card stat"><span class="small muted">${n}</span><div class="num" style="color:${c.faltaAgora > 0 ? 'var(--err)' : 'var(--ok)'}">${c.faltaAgora > 0 ? 'Falta ' + brl(c.faltaAgora) : 'Em dia ✓'}</div><span class="tiny dim">Já pagou ${brl(c.pago)}${c.faltaTotal > c.faltaAgora ? ` · parcelas futuras: ${brl(c.faltaTotal - c.faltaAgora)}` : ''}</span></div>`;
    }).join('')}</div></section>` : ''}
    <button class="btn block" id="novo" style="margin-top:16px">+ Adicionar gasto</button>
    <section><div class="sec-h"><h2>Gastos</h2></div><div class="list">${
      itens.length ? [...itens].sort((a, b) => fimDe(b) - fimDe(a) || b.criado_em.localeCompare(a.criado_em)).map((g) => cartao(g, hoje)).join('')
        : '<div class="card vazio">Nenhum gasto ainda. Toque em <b>Adicionar gasto</b>.</div>'
    }</div></section>
    ${meses.length ? `<section><div class="sec-h"><h2>Por mês</h2>${antigos.length ? '<button class="link" id="ver-ant">Ver meses anteriores</button>' : ''}</div>
      <div class="card" style="padding:6px 12px"><table><thead><tr><th>Mês</th><th class="r">Total</th><th class="r">Cada sócio</th></tr></thead>
      <tbody id="ant" hidden>${antigos.map(linhaMes).join('')}</tbody><tbody>${futuros.map(linhaMes).join('') || '<tr><td colspan="3" class="dim">Nada a pagar daqui pra frente.</td></tr>'}</tbody></table></div></section>` : ''}`;
  document.getElementById('sair').onclick = () => { guarda.limpar(); senha = null; telaSenha(false); };
  document.getElementById('novo').onclick = () => formGasto();
  const va = document.getElementById('ver-ant');
  if (va) va.onclick = () => { const t = document.getElementById('ant'); t.hidden = !t.hidden; va.textContent = t.hidden ? 'Ver meses anteriores' : 'Esconder anteriores'; };
  $app.querySelectorAll('[data-ed]').forEach((b) => (b.onclick = () => formGasto(itens.find((g) => g.id === b.dataset.ed))));
  $app.querySelectorAll('[data-del]').forEach((b) => (b.onclick = () => apagar(itens.find((g) => g.id === b.dataset.del))));
  $app.querySelectorAll('[data-pagar]').forEach((b) => (b.onclick = () => jaPaguei(itens.find((g) => g.id === b.dataset.pagar))));
  $app.querySelectorAll('[data-desf]').forEach((b) => (b.onclick = () => desfazer(pagos.find((x) => x.id === b.dataset.desf))));
}
function cartao(g, hoje) {
  const n = g.parcelas || 1, ini = mesIdx(g.inicio), fim = fimDe(g);
  const pagas = Math.max(0, Math.min(n, hoje - ini + 1));
  const ps = parcelas(g), vp = ps[0].v;
  const cs = NOMES.map((nm) => [nm, contaSocio(g, nm, hoje)]);
  const quitado = cs.every(([, c]) => c.faltaTotal <= 0);
  const hist = pagos.filter((x) => x.gasto_id === g.id);
  const linhaSocio = ([nm, c]) => `<div class="pg-l"><span><b>${nm}</b> pagou ${brl(c.pago)}</span>${
    c.faltaTotal <= 0 ? `<span class="ok">✓ ${c.aMais > 0 ? 'pagou ' + brl(c.aMais) + ' a mais' : 'quitado'}</span>`
    : c.faltaAgora > 0 ? `<span class="falta">falta ${brl(c.faltaAgora)}</span>`
    : `<span class="ok">✓ em dia</span>`}</div>`;
  const linha = n === 1
    ? `À vista em ${mesNome(ini)} · cada sócio ${brl(+g.valor / SOCIOS)}`
    : `${n}x de ${brl(vp)} · cada sócio ${brl(vp / SOCIOS)}/mês · ${mesNome(ini)} a ${mesNome(fim)}`;
  return `<div class="card g"><div class="g-top"><b>${esc(g.descricao)}<span class="tag">${esc(g.categoria)}</span>${quitado ? '<span class="tag ok">quitado</span>' : ''}</b><b class="num" style="font-size:.95rem;white-space:nowrap">${brl(g.valor)}</b></div>
    <span class="small muted">${linha}</span>
    ${n > 1 ? `<div class="bar"><i style="width:${Math.round((pagas / n) * 100)}%"></i></div><span class="tiny dim">${pagas} de ${n} parcelas${pagas < n && pagas > 0 ? ` · faltam ${n - pagas}` : ''}</span>` : ''}
    ${g.obs ? `<span class="tiny dim">${esc(g.obs)}</span>` : ''}
    <div class="pg">${cs.map(linhaSocio).join('')}${n > 1 && !quitado ? `<span class="pg-h">Cada um deve ${brl(+g.valor / SOCIOS)} no total; "falta" é o que já venceu até este mês.</span>` : ''}
      ${hist.length ? `<span class="pg-h">${hist.map((x) => `${esc(x.socio)} · ${brl(x.valor)} em ${dataBR(x.pago_em)}<button class="link" data-desf="${x.id}">desfazer</button>`).join('<br>')}</span>` : ''}</div>
    <div class="acts">${quitado ? '' : `<button class="link" data-pagar="${g.id}">Já paguei</button>`}<button class="link" data-ed="${g.id}">Editar</button><button class="link err" data-del="${g.id}">Apagar</button></div></div>`;
}

/* ---------- adicionar / editar ---------- */
function formGasto(g) {
  const ed = !!g, n0 = g ? g.parcelas : 1;
  $dlg.innerHTML = `<p class="eyebrow">${ed ? 'Editar gasto' : 'Novo gasto'}</p><h2 style="margin:4px 0 16px">${ed ? esc(g.descricao) : 'Adicionar gasto'}</h2>
    <form id="fg">
      <label class="f"><span>O que foi</span><input class="in" name="descricao" required maxlength="120" placeholder="Ex.: Camisas da equipe" value="${esc(g ? g.descricao : '')}"></label>
      <div class="grid2"><label class="f"><span>Valor total</span><input class="in" name="valor" inputmode="decimal" required placeholder="0,00" value="${g ? String(g.valor).replace('.', ',') : ''}"></label>
      <label class="f"><span>Categoria</span><select class="in" name="categoria">${CATS.map((c) => `<option ${g && g.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label></div>
      <div class="f" style="margin-bottom:12px"><span class="small" style="display:block;font-weight:700;color:var(--mute);margin-bottom:6px">Pagamento</span><div class="chips"><button type="button" class="chip ${n0 === 1 ? 'on' : ''}" data-forma="1">À vista</button><button type="button" class="chip ${n0 > 1 ? 'on' : ''}" data-forma="n">Parcelado</button></div></div>
      <div class="grid2"><label class="f" id="lb-n" ${n0 > 1 ? '' : 'hidden'}><span>Quantas vezes</span><input class="in" name="parcelas" type="number" min="2" max="60" value="${n0 > 1 ? n0 : 2}"></label>
      <label class="f"><span id="lb-ini">${n0 > 1 ? 'Mês da 1ª parcela' : 'Mês do pagamento'}</span><input class="in" name="inicio" type="month" required value="${g ? String(g.inicio).slice(0, 7) : mesISO(hojeMes())}"></label></div>
      <label class="f"><span>Observação (opcional)</span><input class="in" name="obs" maxlength="200" value="${esc(g && g.obs ? g.obs : '')}"></label>
      <div class="prev" id="prev"></div>
      <div class="grid2" style="margin-top:16px"><button type="button" class="btn ghost" id="cancelar">Cancelar</button><button class="btn" id="salvar">Salvar</button></div></form>`;
  $dlg.showModal();
  const f = document.getElementById('fg');
  let parc = n0 > 1;
  const valor = () => +String(f.valor.value).replace(/\./g, '').replace(',', '.') || 0;
  const prev = () => {
    const v = valor(), n = parc ? Math.max(2, Math.min(60, +f.parcelas.value || 2)) : 1;
    const ini = f.inicio.value ? mesIdx(f.inicio.value + '-01') : hojeMes();
    const p = Math.floor((v / n) * 100) / 100;
    document.getElementById('prev').innerHTML = !v ? 'Digite o valor para ver a divisão.' : n === 1
      ? `<b>${brl(v)}</b> à vista em ${mesNome(ini)}. Cada sócio paga <b>${brl(v / SOCIOS)}</b>.`
      : `<b>${n}x de ${brl(p)}</b>. Cada sócio paga <b>${brl(p / SOCIOS)} por mês</b>, de ${mesNome(ini)} até <b>${mesNome(ini + n - 1)}</b>.`;
  };
  f.querySelectorAll('[data-forma]').forEach((b) => (b.onclick = () => {
    parc = b.dataset.forma === 'n';
    f.querySelectorAll('[data-forma]').forEach((x) => x.classList.toggle('on', x === b));
    document.getElementById('lb-n').hidden = !parc;
    document.getElementById('lb-ini').textContent = parc ? 'Mês da 1ª parcela' : 'Mês do pagamento';
    prev();
  }));
  f.oninput = prev; prev();
  document.getElementById('cancelar').onclick = () => $dlg.close();
  f.descricao.focus();
  f.onsubmit = async (e) => {
    e.preventDefault();
    const v = valor();
    if (!(v > 0)) return toast('Digite o valor.', true);
    const b = document.getElementById('salvar'); b.disabled = true;
    const { data, error } = await sb.rpc('nx_emp_salvar', {
      p_senha: senha, p_id: g ? g.id : null, p_descricao: f.descricao.value, p_categoria: f.categoria.value, p_valor: v,
      p_parcelas: parc ? Math.max(2, Math.min(60, +f.parcelas.value || 2)) : 1, p_inicio: f.inicio.value + '-01', p_obs: f.obs.value,
    });
    b.disabled = false;
    if (error || !data || data.erro) return toast(msgErro(data && data.erro), true);
    $dlg.close();
    await carregar(senha); painel();
    toast(ed ? 'Gasto atualizado.' : 'Gasto adicionado.');
  };
}
/* ---------- já paguei: quem é você → quanto ---------- */
function jaPaguei(g) {
  const hoje = hojeMes();
  let ult = null;
  try { ult = localStorage.getItem('nx-emp-socio'); } catch {}
  const passo1 = () => {
    $dlg.innerHTML = `<p class="eyebrow">Já paguei</p><h2 style="margin:4px 0 6px">${esc(g.descricao)}</h2><p class="muted" style="margin:0 0 12px">Quem é você?</p>
      <div class="quem">${NOMES.map((n) => `<button type="button" class="chip ${n === ult ? 'on' : ''}" data-quem="${n}">${n}</button>`).join('')}</div>
      <button class="btn ghost block" id="cancelar">Cancelar</button>`;
    if (!$dlg.open) $dlg.showModal();
    document.getElementById('cancelar').onclick = () => $dlg.close();
    $dlg.querySelectorAll('[data-quem]').forEach((b) => (b.onclick = () => passo2(b.dataset.quem)));
  };
  const passo2 = (socio) => {
    try { localStorage.setItem('nx-emp-socio', socio); } catch {}
    const c = contaSocio(g, socio, hoje);
    const sugere = c.faltaAgora > 0 ? c.faltaAgora : c.faltaTotal;
    $dlg.innerHTML = `<p class="eyebrow">Já paguei · ${socio}</p><h2 style="margin:4px 0 6px">${esc(g.descricao)}</h2>
      <p class="muted" style="margin:0 0 12px">${c.faltaAgora > 0 ? `Falta você pagar <b>${brl(c.faltaAgora)}</b>${c.faltaTotal > c.faltaAgora ? ` agora (${brl(c.faltaTotal)} no total, com as parcelas futuras)` : ''}.` : c.faltaTotal > 0 ? `Você está em dia. Ainda faltam <b>${brl(c.faltaTotal)}</b> de parcelas futuras.` : 'Sua parte já está quitada.'}</p>
      <form id="fp"><label class="f"><span>Quanto você pagou?</span><input class="in" name="v" inputmode="decimal" required placeholder="0,00" value="${sugere > 0 ? String(sugere.toFixed(2)).replace('.', ',') : ''}"></label>
      <p class="small muted" id="resta" style="margin:-4px 0 12px"></p>
      <div class="grid2"><button type="button" class="btn ghost" id="voltar">Voltar</button><button class="btn" id="ok">Salvar</button></div></form>`;
    const f = document.getElementById('fp');
    const val = () => +String(f.v.value).replace(/\./g, '').replace(',', '.') || 0;
    const resta = () => {
      const v = val(), r = cent(c.faltaTotal - v);
      document.getElementById('resta').innerHTML = !v ? '' : r > 0 ? `Depois disso ainda falta <b>${brl(r)}</b>.` : r === 0 ? 'Com isso sua parte fica quitada.' : `Isso passa <b>${brl(-r)}</b> do que falta. Fica registrado como pago a mais.`;
    };
    f.oninput = resta; resta();
    f.v.focus(); f.v.select();
    document.getElementById('voltar').onclick = passo1;
    f.onsubmit = async (e) => {
      e.preventDefault();
      const v = val();
      if (!(v > 0)) return toast('Digite quanto você pagou.', true);
      const b = document.getElementById('ok'); b.disabled = true;
      const { data, error } = await sb.rpc('nx_emp_pagamento', { p_senha: senha, p_gasto: g.id, p_socio: socio, p_valor: v });
      b.disabled = false;
      if (error || !data || data.erro) return toast(msgErro(data && data.erro), true);
      $dlg.close(); await carregar(senha); painel();
      const r = cent(c.faltaTotal - v);
      toast(r > 0 ? `Registrado: ${socio} pagou ${brl(v)}. Ainda falta ${brl(r)}.` : `Registrado: ${socio} quitou a parte dele.`);
    };
  };
  passo1();
}
function desfazer(x) {
  $dlg.innerHTML = `<h2>Desfazer este pagamento?</h2><p class="muted">${esc(x.socio)} · ${brl(x.valor)} em ${dataBR(x.pago_em)}. O valor volta para o que falta pagar.</p>
    <div class="grid2" style="margin-top:16px"><button class="btn ghost" id="nao">Cancelar</button><button class="btn" id="sim">Desfazer</button></div>`;
  $dlg.showModal();
  document.getElementById('nao').onclick = () => $dlg.close();
  document.getElementById('sim').onclick = async () => {
    const { data, error } = await sb.rpc('nx_emp_desfazer_pagamento', { p_senha: senha, p_id: x.id });
    if (error || !data || data.erro) return toast(msgErro(data && data.erro), true);
    $dlg.close(); await carregar(senha); painel(); toast('Pagamento desfeito.');
  };
}
function apagar(g) {
  $dlg.innerHTML = `<h2>Apagar "${esc(g.descricao)}"?</h2><p class="muted">O gasto e as parcelas dele saem das contas. Não dá para desfazer.</p>
    <div class="grid2" style="margin-top:16px"><button class="btn ghost" id="nao">Cancelar</button><button class="btn" id="sim" style="background:var(--err)">Apagar</button></div>`;
  $dlg.showModal();
  document.getElementById('nao').onclick = () => $dlg.close();
  document.getElementById('sim').onclick = async () => {
    const { data, error } = await sb.rpc('nx_emp_apagar', { p_senha: senha, p_id: g.id });
    if (error || !data || data.erro) return toast(msgErro(data && data.erro), true);
    $dlg.close(); await carregar(senha); painel(); toast('Gasto apagado.');
  };
}
iniciar();
</script>
